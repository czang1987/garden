name: Deploy Garden

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-garden-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on server over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            set -e
            echo "[deploy] starting on $(hostname)"
            echo "[deploy] entering repo"
            cd ~/garden
            echo "[deploy] pulling latest code"
            git pull origin main
            echo "[deploy] installing dependencies"
            npm ci
            echo "[deploy] building frontend"
            npm run build
            echo "[deploy] syncing dist to /var/www/garden-app/dist"
            mkdir -p /var/www/garden-app/dist
            rsync -a --delete dist/ /var/www/garden-app/dist/
            echo "[deploy] syncing backend files to /home/ubuntu/garden-stylize"
            mkdir -p /home/ubuntu/garden-stylize/server
            rsync -a server/ /home/ubuntu/garden-stylize/server/
            rsync -a package.json package-lock.json /home/ubuntu/garden-stylize/
            echo "[deploy] loading runtime environment"
            set -a
            source /home/ubuntu/garden-stylize/.env.stylize
            set +a
            echo "[deploy] restarting pm2 service"
            pm2 restart garden-stylize --update-env
            echo "[deploy] deployment finished successfully"
